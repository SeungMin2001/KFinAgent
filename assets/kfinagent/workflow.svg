<text x="55" y="164" fill="#f5f8ff" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">OpenDART filings</text>
<text x="55" y="189" fill="#f5f8ff" font-size="17" font-weight="400" font-family="Arial, Helvetica, sans-serif">ECOS + FRED macro</text>
