<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="665" viewBox="0 0 1450 665" role="img" aria-labelledby="title desc">
  <title id="title">KStockAgents Architecture</title>
  <desc id="desc">KIS candles and investor flows, OpenDART filings, ECOS and FRED macro observations and optional Kronos forecasts go to the analyst team. Only KIS candles go to Kronos. Bull and Bear researchers debate and a research manager synthesizes both cases. A trader proposes a plan, three risk analysts review it, and a portfolio manager issues a final rating. The run saves a final brief, full report, evidence log, and chart.</desc>

